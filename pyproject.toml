[project]
name = "collide-logging"
version = "0.7.0"
description = "Python implementation of the collide/v1 logging spec"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Collide" }]
dependencies = [
    "structlog>=24",
]

[project.optional-dependencies]
django = ["django>=5"]
fastapi = ["starlette>=0.37"]
django-q = ["django>=5", "django-q2>=1.10"]

[project.entry-points."djangoq.errorreporters"]
collide_logging = "collide_logging._django_q_reporter:ErrorReporter"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs>=5",
    "httpx>=0.27",
    "pyright==1.1.414",
    "ty==0.0.88",
    "opentelemetry-sdk>=1.45.1",
    "uvicorn>=0.54.0",
    "redis>=8.1.0",
    "azure-core>=1.41.0",
    "aiohttp>=3.14.5",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collide_logging"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
# django-q2 ships no type information and has no stubs package.
module = "django_q.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.typecheck.*"
ignore_errors = false

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.11"

[tool.ty.environment]
extra-paths = ["src"]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
