[project]
name = "collide-logging"
version = "0.10.0"
description = "Python implementation of the collide/v1 logging spec"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Collide" }]
dependencies = [
    "structlog>=24",
]

[project.optional-dependencies]
django = ["django>=5"]
fastapi = ["starlette>=0.37"]
django-q = ["django>=5", "django-q2>=1.10"]

[project.entry-points."djangoq.errorreporters"]
collide_logging = "collide_logging._django_q_reporter:ErrorReporter"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.4",
    "pyyaml>=6",
    "types-pyyaml>=6",
    "mypy==2.3.1",
    "asyncpg-stubs>=0.32.0",
    "django-stubs>=5",
    "httpx>=0.27",
    "pyright==1.1.414",
    "ty==0.0.88",
    "opentelemetry-sdk>=1.45.1",
    "uvicorn>=0.54.0",
    "redis>=8.1.0",
    "azure-core>=1.41.0",
    "aiohttp>=3.14.5",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collide_logging"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "B", "UP", "C4", "SIM", "RUF", "PERF", "FLY", "INT", "PGH",
  "S", "BLE", "TRY", "ASYNC", "G", "LOG", "T20", "DTZ", "PTH", "FBT", "ARG", "ERA",
  "TD002", "TD003", "SLF001", "ANN401", "TID251",
  "PLC0415", "PLR2004", "PLR1736", "PLR0124", "PLW0602", "PLW0603", "PT",
]
ignore = [
  "E501",  # the formatter owns line length
  "TRY003",  # long exception messages: low value, high noise
  "TRY400", "G201",  # push toward ERROR-level logger.exception
  "SIM105",  # rewrites try/except/pass into contextlib.suppress, escaping S110/BLE001
  "B008",  # FastAPI Depends(...) in defaults
  "S603", "S607",  # argv lists to our own tools; S607's fix (absolute paths) is wrong cross-platform
  # pending hand fixes; tests/test_lint_policy.py PENDING_RULES names them and only shrinks
  "TRY301", "PT011", "PT017", "PLC0415", "T201", "G004", "DTZ005",
]
allowed-confusables = ["–", "—", "’", "×", "−", "…"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING" = { msg = "No lazy or conditional imports; import at module level." }
"os.environ" = { msg = "Read the environment only through the env boundary module." }
"os.getenv" = { msg = "Read the environment only through the env boundary module." }
"logging.FileHandler" = { msg = "Logs go to stdout." }
"logging.handlers.RotatingFileHandler" = { msg = "Logs go to stdout." }
"logging.handlers.TimedRotatingFileHandler" = { msg = "Logs go to stdout." }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S608", "PLR2004", "SLF001", "ARG", "FBT", "ANN401"]
"typecheck/**" = ["S101", "S105", "S106", "S107", "S608", "PLR2004", "SLF001", "ARG", "FBT", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
strict_equality_for_none = true
enable_error_code = [
  "exhaustive-match", "deprecated", "ignore-without-code",
  "possibly-undefined", "redundant-expr", "truthy-bool", "truthy-iterable",
  "unused-awaitable", "mutable-override",
]
exclude = ["/migrations/"]
files = ["src", "tests", "typecheck/positive.py"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*", "*.tests", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# django-q2 ships no type information and has no stubs package.
module = "django_q.*"
ignore_missing_imports = true

[tool.ty.environment]
extra-paths = ["src"]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
