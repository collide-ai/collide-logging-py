name: Publish

# Publishes each release to the collide-artifacts Azure Artifacts feed, where
# every other internal Python package lives. Git tags stay installable too.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.6.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to collide-artifacts
        env:
          AZURE_ARTIFACTS_PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}
        run: |
          if [ -z "${AZURE_ARTIFACTS_PAT}" ]; then
            echo "AZURE_ARTIFACTS_PAT is not set for this repository" >&2
            exit 1
          fi
          uv publish \
            --publish-url "https://pkgs.dev.azure.com/collide-enterprise/Collide-Enterprise/_packaging/collide-artifacts/pypi/upload/" \
            --username token --password "${AZURE_ARTIFACTS_PAT}" dist/*
