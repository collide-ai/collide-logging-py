name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER_GENERAL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra django --extra fastapi --extra django-q --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ${{ vars.CI_RUNNER_GENERAL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra django --extra fastapi --extra django-q --group dev
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
            mypy-${{ runner.os }}-
      - run: uv run mypy

  test:
    runs-on: ${{ vars.CI_RUNNER_GENERAL || 'ubuntu-latest' }}
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --python ${{ matrix.python }} --extra django --extra fastapi --extra django-q --group dev
      - run: uv run pytest

  check-issue-link:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_GENERAL || 'ubuntu-latest' }}
    steps:
      - name: Verify PR body references an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -qiE '(closes|fixes|resolves) #[0-9]+'; then
            echo "PR references an issue."
          else
            echo "PR body must contain 'Closes #<num>' or 'Fixes #<num>'." >&2
            exit 1
          fi
